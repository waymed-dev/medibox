<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIBOX 앱 다운로드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script>
        var userAgent = navigator.userAgent.toLowerCase();
        if (/iphone|ipad|ipod/.test(userAgent)) {
            // replace를 사용하여 뒤로 가기 시 무한 루프에 빠지는 것을 방지합니다.
            window.location.replace("https://apps.apple.com/us/app/%EB%A9%94%EB%94%94%EB%B0%95%EC%8A%A4/id6760811577");
        } else if (/android/.test(userAgent)) {
            window.location.replace("https://play.google.com/store/apps/details?id=kr.co.kbsmc.mydata&hl=ko");            
        }
    </script>

    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            z-index: 1;
        }

        /* 배경 장식 */
        .bg-decoration {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--secondary-color) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.15;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        .logo {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            border-radius: 24px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem; /* 텍스트 길이에 맞게 폰트 사이즈 조정 */
            font-weight: bold;
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 2.5rem;
            word-break: keep-all; /* 텍스트 줄바꿈 자연스럽게 처리 */
        }

        .store-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #1e293b;
            color: white;
            border: 2px solid #1e293b;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: #0f172a;
            border-color: #0f172a;
        }

        .badge {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 2px;
            color: #cbd5e1; /* 버튼 내부 텍스트 대비 향상 */
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="container">
        <div class="logo">메디박스</div>
        
        <h1>지금 바로 만나보세요!</h1>
        <p>강북삼성병원 마이데이터 서비스, <strong>메디박스</strong> 앱이 정식 출시되었습니다.<br>이용 중이신 기기에 맞게 앱을 다운로드하고 스마트한 건강 관리를 시작해 보세요.</p>

        <div class="store-buttons">
            <a href="https://apps.apple.com/us/app/%EB%A9%94%EB%94%94%EB%B0%95%EC%8A%A4/id6760811577" class="btn">
                <div style="text-align: left;">
                    <span class="badge">Download on the</span>
                    <strong>App Store</strong>
                </div>
            </a>

            <a href="https://play.google.com/store/apps/details?id=kr.co.kbsmc.mydata&hl=ko" class="btn">
                <div style="text-align: left;">
                    <span class="badge">Download on the</span>
                    <strong>Google Play</strong>
                </div>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 강북삼성병원. All rights reserved.
        </div>
    </div>
</body>
</html>
